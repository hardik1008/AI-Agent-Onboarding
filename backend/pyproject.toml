[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S105", "S106"]

[tool.ruff.lint.pycodestyle]
max-line-length = 200

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"alembic/*" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
