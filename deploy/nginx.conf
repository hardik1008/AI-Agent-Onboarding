# Single public entry point. Overwrites X-Forwarded-For with the real peer address so the backend
# (TRUST_PROXY_HEADERS=true) records true client IPs and clients cannot spoof them.
upstream backend { server backend:8000; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_tokens off;
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ { proxy_pass http://backend; }
    location /health { proxy_pass http://backend; }
    location / { proxy_pass http://frontend; }
}
